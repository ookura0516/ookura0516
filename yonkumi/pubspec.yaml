name: yonkumi
description: "ヨンクミ：16語を4組に分ける、日替わりの言葉パズル"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1
  ookura_daily:
    path: ../packages/ookura_daily
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/puzzles.json

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F6F1E7"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
