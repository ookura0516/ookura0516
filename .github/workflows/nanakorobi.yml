# ナナコロビ：テスト、ネイティブのビルド、ストアへのアップロード（keshiin.yml と同じ形）
#
# - push / pull request：テストと、署名なしの Android・iOS のビルド（コンパイルの確認）
# - 手動実行（Actions → nanakorobi → Run workflow）で upload を選ぶと、署名してストアの
#   テスト用の場所に上げる。Google Play は内部テスト（下書き）、App Store は TestFlight。
#   一般公開は、ストアの管理画面で人が行う（このワークフローはしない）。
#
# アップロードに要るシークレット（Settings → Secrets and variables → Actions）は
# nanakorobi/docs/STORE_RELEASE.md の「GitHub Actions でのビルドとアップロード」を参照。
# keshiin と同じ名前のシークレットを使う。
name: nanakorobi

on:
  push:
    paths:
      - 'nanakorobi/**'
      - '.github/workflows/nanakorobi.yml'
  pull_request:
    paths:
      - 'nanakorobi/**'
      - '.github/workflows/nanakorobi.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'ストアに上げる（none：ビルドだけ）'
        type: choice
        default: none
        options:
          - none
          - play-internal
          - testflight
          - both

concurrency:
  group: nanakorobi-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

defaults:
  run:
    working-directory: nanakorobi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 署名鍵（シークレットがあるときだけ）
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "署名鍵のシークレットが無いので、デバッグ鍵で署名する（ストアには出せない）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter build appbundle --release
      - run: flutter build apk --release
      - name: ウィジェットと 0 時更新の受け口が APK に入っているか
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT2" dump xmltree --file AndroidManifest.xml \
            build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/manifest.txt"
          grep -q NanakorobiWidgetProvider "$RUNNER_TEMP/manifest.txt"
          grep -q HomeWidgetScheduledUpdateReceiver "$RUNNER_TEMP/manifest.txt"
          grep -q RECEIVE_BOOT_COMPLETED "$RUNNER_TEMP/manifest.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: nanakorobi-android
          path: |
            nanakorobi/build/app/outputs/bundle/release/app-release.aab
            nanakorobi/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Google Play の内部テストに上げる（下書き）
        if: github.event_name == 'workflow_dispatch' && (inputs.upload == 'play-internal' || inputs.upload == 'both')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ookura.nanakorobi
          releaseFiles: nanakorobi/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 署名なしでビルド（アプリとウィジェットのコンパイルの確認）
        run: flutter build ios --release --no-codesign
      - name: ウィジェットがアプリに入っているか
        run: |
          test -d build/ios/iphoneos/Runner.app/PlugIns/NanakorobiWidgetExtension.appex
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' \
            build/ios/iphoneos/Runner.app/PlugIns/NanakorobiWidgetExtension.appex/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            build/ios/iphoneos/Runner.app/PlugIns/NanakorobiWidgetExtension.appex/Info.plist
      - name: 署名して TestFlight に上げる
        if: github.event_name == 'workflow_dispatch' && (inputs.upload == 'testflight' || inputs.upload == 'both')
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          flutter build ios --release --config-only
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
