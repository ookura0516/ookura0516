name: keshiin
description: "ケシイン：今日の1枚が、切手と消印になる。1日1枚の写真を月のシートに集める記録アプリ"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  in_app_purchase: ^3.3.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  image_picker: ^1.2.4
  exif: ^3.3.0
  image: ^4.12.0
  geocoding: ^5.0.1
  share_plus: ^13.3.1
  archive: ^4.6.0
  home_widget: ^0.10.0
  in_app_review: ^2.0.12
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/municipalities.csv
