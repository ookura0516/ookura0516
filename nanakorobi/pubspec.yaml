name: nanakorobi
description: "ナナコロビ：だるまに目を入れて目標を始める、七転び八起きの目標帳"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.4.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.2
  home_widget: ^0.10.0
  share_plus: ^13.3.1
  in_app_review: ^2.0.12
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  freezed: ^4.0.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/presets/exam_dates.json
  fonts:
    - family: YujiSyuku
      fonts:
        - asset: assets/fonts/YujiSyuku-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#F3ECDF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
