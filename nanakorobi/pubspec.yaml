name: nanakorobi
description: "ナナコロビ：だるまに目を入れて目標を始め、毎日の一歩で模様が入る目標帳"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  collection: ^1.19.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.2
  home_widget: ^0.10.0
  in_app_purchase: ^3.3.1
  in_app_review: ^2.0.12
  intl: ^0.20.3
  json_annotation: ^4.12.0
  meta: ^1.19.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/presets/exam_dates.json
    - assets/fonts/OFL.txt

  # 毛筆体：Yuji Syuku（Kinuta Font Factory、SIL Open Font License 1.1）。腹の文字と共有画像で使う。
  # ライセンス全文は assets/fonts/OFL.txt に同梱し、設定 → ライセンスに出す（lib/main.dart）。
  fonts:
    - family: NanakorobiBrush
      fonts:
        - asset: assets/fonts/YujiSyuku-Regular.ttf
